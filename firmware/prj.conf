# SnowGauge firmware - step 1: scaffold + TFmini UART test
# Board: xiao_ble/nrf52840/sense  (Seeed XIAO nRF52840 Sense)

# --- Peripherals ---
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ADC=y
CONFIG_RING_BUFFER=y

# On-board IMU (LSM6DS3TR-C on i2c0) via the lsm6dsl driver; accel only
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_FPU=y

# QSPI flash driver so it can be put into deep power-down (records later)
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y

# Device power management: lets us suspend the TFmini UART so that its
# pins go Hi-Z before the sensor rail is cut (ghost-powering countermeasure,
# spec section 12.3).
CONFIG_PM_DEVICE=y

# --- Console / shell over USB CDC ACM ---
# The xiao_ble board already routes zephyr,console / zephyr,shell-uart to a
# CDC ACM instance (USB device_next stack, initialized at boot).
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="SnowGauge"
# Do not enable USB at boot: udc_nrf keeps HFXO + USBD on regardless of VBUS
# (~1.8 mA). usb_pm.c enables the device only while VBUS is present.
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="sg:~$ "
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Misc ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_REBOOT=y

# Debug helpers
CONFIG_SENSOR_SHELL=y
CONFIG_DEVICE_SHELL=y

# --- Record storage (step 4a) ---
# LittleFS on the QSPI flash; internal-flash mirror through flash_map.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FS_LITTLEFS_NUM_FILES=2
CONFIG_FS_LITTLEFS_NUM_DIRS=2
# QSPI flash: runtime PM = deep power-down between accesses (see overlay).
CONFIG_PM_DEVICE_RUNTIME=y
# Only devices with zephyr,pm-device-runtime-auto (the QSPI flash) get runtime
# PM. The Nordic default would enable it for every device, and the UARTE
# driver would then re-activate the TFmini UART (TX high) while the rail is
# off - the ghost-powering case sensor_rail.c exists to prevent.
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=n
CONFIG_NORDIC_QSPI_NOR_ACTIVE_DWELL_MS=50
# Wall clock: emulated RTC behind the `rtc` alias (timekeeping.c).
CONFIG_RTC=y
# CRC-16 for the record checksum
CONFIG_CRC=y

# --- BLE (step 4b: status advertising; SMP + calibration GATT follow) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SnowGauge"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_MAX_CONN=1
CONFIG_HWINFO=y
# Larger ACL / L2CAP buffers so SMP file download runs at a usable speed
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# --- SMP / mcumgr over BLE (step 4c): fs download + os datetime/echo/reset ---
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_DATETIME=y
CONFIG_MCUMGR_GRP_OS_DATETIME_HOOK=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_BASE64=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
# SMP also over the USB shell (bench: smpmgr/smpclient on the dev PC, e.g. datetime)
CONFIG_MCUMGR_TRANSPORT_SHELL=y

# --- Settings (step 4d): schedule + calibration in the internal storage partition ---
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_GRP_SETTINGS_NAME_LEN=32
CONFIG_MCUMGR_GRP_SETTINGS_VALUE_LEN=32
# Calibration GATT
CONFIG_BT_GATT_CLIENT=n
